<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compost</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #171717;
      color: #f4f4f4;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      grid-template-rows: auto auto auto 1fr;
    }
    header {
      min-height: 86px;
      padding: 8px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      row-gap: 4px;
      border-bottom: 1px solid #393939;
      background: #202020;
    }
    h1 {
      flex: 1 1 140px;
      min-width: 0;
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
    }
    compost-audio,
    compost-button,
    compost-midi,
    compost-radio-group {
      --compost-audio-text: #f4f4f4;
      --compost-audio-muted: #bbb;
      --compost-audio-inactive-color: #ddd;
      --compost-audio-active-color: #8ee3b2;
      --compost-audio-active-text: #171717;
      --compost-audio-button-bg: #252525;
      --compost-audio-button-size: 54px;
      --compost-audio-button-gap: #202020;
      --compost-audio-focus-bracket-color: #8ee3b2;
      --compost-audio-color-scheme: dark;
      --compost-button-size: 54px;
      --compost-button-bg: #252525;
      --compost-button-border: #ddd;
      --compost-button-text: #ddd;
      --compost-button-fill: #8ee3b2;
      --compost-button-fill-text: #171717;
      --compost-button-gap: #202020;
      --compost-button-focus-bracket-color: #8ee3b2;
      --compost-button-color-scheme: dark;
      font-size: 11px;
    }
    compost-midi {
      width: min(220px, 28vw);
      --compost-midi-text: #f4f4f4;
      --compost-midi-muted: #bbb;
      --compost-midi-control-bg: #252525;
      --compost-midi-control-border: #ddd;
      --compost-midi-focus-color: #8ee3b2;
      --compost-midi-color-scheme: dark;
    }
    #midi-slot {
      flex: 0 1 220px;
      min-width: 0;
    }
    #preset-panel {
      padding: 10px 18px;
      border-bottom: 1px solid #393939;
      background: #202020;
    }
    #plugin-panel,
    #preset-panel,
    #parameter-panel[hidden],
    #plugin-panel[hidden],
    #preset-panel[hidden],
    #midi-mappings-panel[hidden] { display: none; }
    #plugin-panel,
    #preset-panel {
      padding: 10px 18px;
      border-bottom: 1px solid #393939;
      background: #202020;
    }
    compost-radio-group {
      --compost-radio-group-color: #ddd;
      --compost-radio-group-fill: #8ee3b2;
      --compost-radio-group-focus: #8ee3b2;
      --compost-radio-group-color-scheme: dark;
    }
    compost-midi-map {
      --compost-midi-map-bg: #252525;
      --compost-midi-map-border: #ddd;
      --compost-midi-map-text: #ddd;
      --compost-midi-map-focus-color: #8ee3b2;
      --compost-midi-map-color-scheme: dark;
      --midi-map-learn-color: #8ee3b2;
      font-size: 11px;
    }
    #midi-mappings-panel {
      border-bottom: 1px solid #393939;
      background: #171717;
    }
    #midi-mappings-panel summary {
      padding: 10px 18px;
      color: #e7ebf0;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      list-style: none;
      text-transform: uppercase;
    }
    #midi-mappings-panel summary::-webkit-details-marker { display: none; }
    #midi-mappings-panel summary::before {
      content: '+';
      display: inline-block;
      width: 1.2em;
      color: #8ee3b2;
    }
    #midi-mappings-panel[open] summary { border-bottom: 1px solid #393939; }
    #midi-mappings-panel[open] summary::before { content: '−'; }
    #midi-mappings-panel compost-midi-map { border-bottom: 0; }
    #effect-controls[hidden] { display: none; }
    #effect-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 0 0 auto;
    }
    main {
      min-height: 0;
      padding: 18px;
      display: grid;
      grid-template-rows: minmax(280px, 1fr) auto;
      gap: 18px;
    }
    iframe {
      width: min(100%, 640px);
      height: 420px;
      max-height: calc(100vh - 230px);
      min-height: 280px;
      aspect-ratio: 640 / 420;
      justify-self: center;
      border: 0;
      border-radius: 8px;
      background: #171717;
    }
    #parameter-panel {
      display: grid;
      gap: 10px;
      padding: 12px;
      border: 1px solid #393939;
      border-radius: 8px;
      background: #202020;
    }
    #parameter-panel h2 {
      margin: 0;
      font-size: 0.8rem;
      font-weight: 600;
      color: #bbb;
    }
    #parameters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px 18px;
    }
    compost-slider {
      --slider-panel-bg: transparent;
      --slider-text: #f4f4f4;
      --slider-value: #e1e7ee;
      --slider-fill: #8ee3b2;
      --slider-thumb: #f4f4f4;
      --slider-thumb-border: #171717;
      --slider-track: #6c7682;
      --slider-value-editor-bg: #252525;
      --slider-focus-bracket-color: #8ee3b2;
      --midi-map-learn-color: #8ee3b2;
      --midi-map-label-shadow: 0 1px 2px #171717;
      min-width: 0;
    }
    #status {
      place-self: center;
      max-width: 70ch;
      color: #bbb;
      text-align: center;
      white-space: pre-wrap;
    }
    #status[data-error] { color: #ff9b9b; }
    #cpu {
      flex: 0 0 auto;
      min-width: 9ch;
      width: max-content;
      margin-left: auto;
      color: #aaa;
      font: 11px ui-monospace, monospace;
      white-space: nowrap;
      text-align: right;
    }
    audio,
    input[type="file"] { display: none; }
  </style>
</head>
<body data-archive="examples/public/char-example-synth.wclap.tar.gz?v=20260806-midi-map">
  <script src="./page-proxy-service-worker.js"></script>
  <header>
    <h1 id="plugin-name">Compost</h1>
    <div id="midi-slot"></div>
    <div id="effect-controls" hidden>
      <compost-button id="play-input" label="Play"></compost-button>
      <compost-button id="load-input" label="Load"></compost-button>
    </div>
    <compost-audio start-label="Start" stop-label="Stop"></compost-audio>
    <output id="cpu" aria-label="CPU use"></output>
  </header>
  <section id="plugin-panel" aria-label="Plugins" hidden>
    <compost-radio-group id="plugins" label="Plugin"></compost-radio-group>
  </section>
  <section id="preset-panel" aria-label="Presets" hidden>
    <compost-radio-group id="presets" label="Presets"></compost-radio-group>
  </section>
  <details id="midi-mappings-panel" aria-label="MIDI mappings" hidden>
    <summary>MIDI mapping</summary>
    <compost-midi-map id="midi-map" label="Map MIDI"></compost-midi-map>
  </details>
  <main>
    <output id="status" role="status">Press Start to load the plug-in.</output>
    <section id="parameter-panel" aria-label="Parameters" hidden>
      <h2>Parameters</h2>
      <div id="parameters"></div>
    </section>
  </main>
  <audio id="input-audio" src="./audio/loop.mp3" loop crossorigin="anonymous"></audio>
  <input id="audio-file" type="file" accept="audio/*">
  <script type="module" src="./main.js?v=20260806-midi-map"></script>
</body>
</html>
