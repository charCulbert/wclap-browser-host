<!doctype html>
<html lang="en" data-compost-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wclap-browser-host</title>
  <link rel="stylesheet" href="./compost/src/themes.css">
  <link rel="stylesheet" href="./host.css">
</head>
<body data-archive="examples/public/char-example-synth.wclap.tar.gz?v=20260808-host-ui">
  <script src="./page-proxy-service-worker.js"></script>
  <div class="app-frame">
    <header class="host-toolbar">
      <h1 id="plugin-name" class="sr-only">Compost</h1>
      <compost-audio
        modal
        centered-while-off
        start-label="⏻"
        stop-label="⏻"
        start-aria-label="Start audio"
        stop-aria-label="Suspend audio"
        latency-hint="0"
      ></compost-audio>
      <compost-button id="midi-map-toggle" mode="switch" label="MIDI Map" hidden></compost-button>
      <button id="archive-drop" class="toolbar-button" type="button" aria-label="Load a WCLAP plug-in">Load WCLAP</button>
      <div id="effect-controls" hidden>
        <compost-button id="play-input" label="Play"></compost-button>
        <compost-button id="load-input" label="Load"></compost-button>
      </div>
      <section id="plugin-panel" class="toolbar-select" aria-label="Plugins" hidden>
        <span>Plugin</span>
        <compost-select id="plugins" name="plugin" aria-label="Plugin"></compost-select>
      </section>
      <section id="preset-panel" class="toolbar-select" aria-label="Presets" hidden>
        <span>Preset</span>
        <compost-select id="presets" name="preset" aria-label="Preset"></compost-select>
      </section>
      <button id="host-controls-toggle" class="toolbar-button" type="button" hidden aria-pressed="false">UI</button>
      <button id="plugin-info-toggle" class="toolbar-button" type="button" hidden aria-pressed="false">Info</button>
      <output id="cpu" aria-label="CPU use"></output>
    </header>

    <section id="plugin-info-panel" aria-label="Plug-in information" hidden>
      <h2>Plug-in information</h2>
      <dl id="plugin-info"></dl>
    </section>

    <compost-drawer
      id="midi-drawer"
      class="midi-drawer"
      edge="left"
      resizable
      min-size="320"
      max-size="560"
      hidden
    >
      <span slot="title" class="midi-drawer-title">
        MIDI
        <span class="midi-activity-led" data-midi-activity aria-hidden="true"></span>
      </span>
      <div class="drawer-stack">
        <section class="drawer-section">
          <h2>Input</h2>
          <div id="midi-slot"></div>
        </section>
        <section id="midi-mappings-section" class="drawer-section" hidden>
          <h2>Mappings</h2>
          <p>Use MIDI Map, then move a real MIDI CC over a plug-in control.</p>
          <compost-midi-mappings id="midi-map"></compost-midi-mappings>
        </section>
      </div>
    </compost-drawer>

    <main>
      <output id="status" role="status">Press Start to load the plug-in.</output>
      <section id="parameter-panel" aria-label="Parameters" hidden>
        <h2>Parameters</h2>
        <div id="parameters"></div>
      </section>
    </main>
  </div>

  <compost-piano id="host-keyboard" root-note="36" note-count="49" hidden></compost-piano>
  <audio id="input-audio" src="./audio/loop.mp3" loop crossorigin="anonymous"></audio>
  <input id="audio-file" type="file" accept="audio/*">
  <input id="archive-file" type="file" accept=".wclap,.wclap.tar.gz,.tar.gz,application/gzip,application/x-gzip">
  <script type="module" src="./main.js?v=20260810-centered-audio"></script>
</body>
</html>
